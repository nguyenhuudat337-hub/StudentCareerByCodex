[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "career-classification-v31"
version = "3.1.0"
description = "Phân loại nhóm nghề nghiệp — kế hoạch Big Data Analytics 3.1"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
